# products.yaml - Mustache 列表循环示例
#
# 本文件展示如何在邮件模板中使用 Mustache 的列表循环功能。
# 运行命令：juice template-products.html -c products.yaml

# ─── 模板变量 ─────────────────────────────────────────────────────────────────
variables:
  brandName: "优品商城"
  brandColor: "#e74c3c"
  logoUrl: "https://via.placeholder.com/150x50/ffffff/cccccc?text=LOGO"
  websiteUrl: "https://shop.example.com"
  recipientName: "张三"
  subject: "本周精选优惠商品"
  previewText: "查看本周精选优惠商品，最高立减 200 元"
  companyName: "优品商城"
  companyAddress: "北京市朝阳区建国路 88 号"
  unsubscribeUrl: "https://shop.example.com/unsubscribe"
  currentYear: "2026"

  # ── 产品列表 ────────────────────────────────────────────────────────────────
  # 使用 {{#products}}...{{/products}} 循环遍历
  products:
    - name: "无线蓝牙耳机"
      price: "¥299.00"
      originalPrice: "¥399.00"
      image: "https://via.placeholder.com/200x200/e74c3c/ffffff?text=耳机"
      tag: "热卖"
    - name: "智能手环 Pro"
      price: "¥199.00"
      originalPrice: "¥299.00"
      image: "https://via.placeholder.com/200x200/3498db/ffffff?text=手环"
      tag: "新品"
    - name: "便携充电宝"
      price: "¥89.00"
      originalPrice: "¥129.00"
      image: "https://via.placeholder.com/200x200/2ecc71/ffffff?text=充电宝"
      tag: "特惠"
    - name: "无线键盘套装"
      price: "¥159.00"
      originalPrice: "¥259.00"
      image: "https://via.placeholder.com/200x200/9b59b6/ffffff?text=键盘"
      tag: ""

  # ── 功能列表 ────────────────────────────────────────────────────────────────
  # 嵌套循环示例
  features:
    - title: "品质保障"
      icon: "✓"
      items:
        - "正品保证"
        - "7 天无理由退换"
        - "全国联保"
    - title: "配送服务"
      icon: "📦"
      items:
        - "次日达"
        - "包邮到家"
        - "实时物流"
    - title: "售后服务"
      icon: "🎧"
      items:
        - "专属客服"
        - "终身维护"
        - "极速退款"

# ─── juice CSS 内联选项 ──────────────────────────────────────────────────────
juice:
  preserveMediaQueries: true
  preservedSelectors:
    - ".gmail-"
    - "#outlook-"
    - "a:hover"

# ─── 输出选项 ─────────────────────────────────────────────────────────────────
output:
  normalSuffix: "-products.output.html"
  minifiedSuffix: "-products.minified.html"
