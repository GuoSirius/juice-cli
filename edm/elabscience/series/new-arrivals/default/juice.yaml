# juice.yaml - 用户配置文件示例
#
# 放置位置（优先级从低到高）：
#   ~/juice.yaml          ← 用户主目录，对所有项目生效
#   <模板文件目录>/juice.yaml ← 仅对当前项目生效（推荐）
#   juice -c <此文件>       ← 命令行指定
#
# 所有配置项均与 CLI 内置默认值深度合并，未填写的字段自动使用内置值。
# 完整默认配置见：<CLI安装目录>/defaults/juice.yaml

