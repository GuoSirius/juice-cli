name: CI & Publish

# 单一流程：先验证，再发布。验证不通过则下游发布任务不执行（自动终止）。
on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:

jobs:
  # ① 验证闸门：分支 push / PR / tag 推送都会先跑这里
  quality:
    name: Validate (lint, unit, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Smoke test
        run: npm test

  # ② 发布：仅当 ① 通过 且 本次是 v* tag 推送时才运行
  publish:
    name: Publish to npm & GitHub Release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from CHANGELOG
        id: generate_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Extracting release notes for v$VERSION"

          if [ ! -f CHANGELOG.md ]; then
            echo "RELEASE_NOTES=See [CHANGELOG.md](https://github.com/GuoSirius/juice-cli/blob/main/CHANGELOG.md) for detailed changes." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # standard-version uses ## for minor/major bumps, ### for patch bumps.
          # Extract everything between the target version heading and the next
          # version heading (any level), or EOF.
          node -e "
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const lines = changelog.split('\n');

            const verRe = /^#+\s*\[v?(\d+\.\d+\.\d+)\]/;
            let start = -1;
            let end = -1;

            for (let i = 0; i < lines.length; i++) {
              const m = lines[i].match(verRe);
              if (m) {
                if (m[1] === '$VERSION') {
                  start = i + 1;
                } else if (start >= 0) {
                  end = i;
                  break;
                }
              }
            }

            if (start >= 0) {
              while (start < lines.length && lines[start].trim() === '') start++;
              while (end > start && lines[end - 1].trim() === '') end--;
              const notes = lines.slice(start, end >= 0 ? end : lines.length).join('\n').trim();
              if (notes) process.stdout.write(notes);
            }
          " > release_notes.txt

          if [ -s release_notes.txt ]; then
            DELIM="EOF$(openssl rand -hex 8)"
            printf 'RELEASE_NOTES<<%s\n' "$DELIM" >> "$GITHUB_OUTPUT"
            cat release_notes.txt >> "$GITHUB_OUTPUT"
            printf '\n%s\n' "$DELIM" >> "$GITHUB_OUTPUT"
          else
            echo 'RELEASE_NOTES=See [CHANGELOG.md](https://github.com/GuoSirius/juice-cli/blob/main/CHANGELOG.md) for detailed changes.' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## What's Changed in v${{ steps.get_version.outputs.VERSION }}

            ${{ steps.generate_notes.outputs.RELEASE_NOTES }}

            ---

            ### Installation

            ```bash
            npm install -g juice-email-cli@${{ steps.get_version.outputs.VERSION }}
            ```

            ### Changelog

            See the full [CHANGELOG.md](https://github.com/GuoSirius/juice-cli/blob/main/CHANGELOG.md) for all changes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        run: rm -f release_notes.txt
