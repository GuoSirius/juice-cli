# juice-email-cli 内置默认配置
#
# 配置加载顺序（优先级从低到高）：
#   1. CLI 内置默认值（defaults/juice.yaml）
#   2. 用户主目录 ~/juice.yaml（如果存在）
#   3. 优先配置文件（-c 指定 或 输入文件同级目录，二者互斥，只生效一个）
#
# 合并方式：深度合并，后面的覆盖前面的
#
# 用户配置文件（~/juice.yaml 或项目 juice.yaml）只需填写需要覆盖的字段即可。

# ─── juice CSS 内联选项 ───────────────────────────────────────────────────────
juice:
  # 处理后移除 <style> 标签（推荐 true，提高 Gmail/Outlook 等兼容性）
  removeStyleTags: true

  # 保留 @media 媒体查询到独立 <style> 块（响应式邮件必须开启）
  preserveMediaQueries: true

  # 保留 @font-face 声明（自定义字体支持）
  preserveFontFaces: true

  # 保留 @keyframes 动画（部分邮件客户端支持）
  preserveKeyFrames: true

  # 将 style 内容转换为 table 系列元素的 HTML 属性（align/bgcolor 等）
  # 开启后对 Outlook 2003-2019 兼容性更好
  applyAttributesTableElements: true

  # 是否处理 <style> 标签中的 CSS（通常 true）
  applyStyleTags: true

  # 保留 CSS 中的 !important 声明
  preserveImportant: true

  # 解析 CSS 变量（如 var(--main-color)）
  resolveCSSVariables: true

  # 为图片元素应用 width 属性
  applyWidthAttributes: true

  # 为图片元素应用 height 属性
  applyHeightAttributes: true

  # 保留伪元素 (::before, ::after) 对应的 <style> 块
  # 注意：邮件中通常不使用，可能与布局冲突，设为 false
  inlinePseudoElements: false

  # 额外附加的外部 CSS 文件（相对于 HTML 模板所在目录）
  # extraCssFiles: []

# ─── 模板变量（Mustache 语法：{{变量名}}）────────────────────────────────────
variables:
  brandName: ""
  brandColor: "#0066cc"
  logoUrl: ""
  websiteUrl: ""
  recipientName: "用户"
  subject: ""
  previewText: ""
  ctaText: "立即查看"
  ctaUrl: ""
  companyName: ""
  companyAddress: ""
  unsubscribeUrl: ""
  currentYear: "2026"

# ─── 输出选项 ─────────────────────────────────────────────────────────────────
output:
  # 普通输出文件后缀
  normalSuffix: ".output.html"
  # 压缩输出文件后缀
  minifiedSuffix: ".minified.html"
  # 文件编码
  encoding: "utf8"

# ─── 压缩选项（html-minifier-terser）────────────────────────────────────────
# ⚠️ 邮件 HTML 压缩注意事项：
#   1. 必须保持 removeConditionalComments: false，保护 Outlook 条件注释
#   2. 不要移除属性引号，确保兼容性
#   3. 不要移除空属性，某些属性是必需的
#   4. 不要移除空元素，Outlook 对此支持不佳
minify:
  # 折叠多余空白
  collapseWhitespace: true

  # 保守折叠：始终保留至少 1 个空格（避免单词连在一起）
  conservativeCollapse: true

  # 移除 HTML 注释（注意：不会移除条件注释）
  removeComments: true

  # 保留条件注释（不要改为 true，会删除 <!--[if mso]> 等 Outlook MSO 兼容代码）
  removeConditionalComments: false

  # 压缩内联 CSS（style 属性）
  minifyCSS: true

  # 压缩内联 JS（邮件中通常无 JS，保持 false）
  minifyJS: false

  # 移除空属性（设为 false 确保兼容性）
  removeEmptyAttributes: false

  # 规范化布尔属性（设为 false 确保兼容性）
  collapseBooleanAttributes: false

  # 移除冗余属性（当属性值与默认值相同时）
  removeRedundantAttributes: true

  # 使用短的 doctype
  useShortDoctype: true

  # 保留行尾换行（配合 collapseWhitespace 使用）
  preserveLineBreaks: false
